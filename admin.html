<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ELECZONA admin</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--or:#FED700;--or2:#FFF8CC;--bk:#141414;--gr:#6b6b6b;--ln:#ececec;--gn:#1a9b4b;--rd:#d93025}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#fff;color:var(--bk);padding-bottom:90px}
header{position:sticky;top:0;z-index:10;background:var(--bk);color:#fff;padding:12px 16px;font-size:18px;font-weight:700}
header span{color:var(--or)}
.tabs{display:flex;border-bottom:1px solid var(--ln);position:sticky;top:46px;background:#fff;z-index:9}
.tabs button{flex:1;border:0;background:none;padding:14px;font-size:15px;font-weight:700;color:var(--gr);border-bottom:3px solid transparent}
.tabs button.on{color:var(--bk);border-bottom-color:var(--or)}
.wrap{padding:12px 16px}
.item{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--ln)}
.thumb{width:56px;height:56px;border-radius:12px;background:var(--or2);display:flex;align-items:center;justify-content:center;font-size:26px;overflow:hidden;flex:none}
.thumb img{width:100%;height:100%;object-fit:cover}
.mid{flex:1;min-width:0}
.nm{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:13px;color:var(--gr);margin-top:2px}
.profit{color:var(--gn);font-weight:700}
.loss{color:var(--rd);font-weight:700}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;background:#eee;color:#555;margin-left:6px}
.fab{position:fixed;left:12px;right:12px;bottom:12px;background:var(--or);color:#111;border:0;border-radius:14px;padding:15px;font-size:16px;font-weight:800;box-shadow:0 6px 18px rgba(254,215,0,.35)}
label{display:block;font-size:13px;font-weight:600;margin:14px 0 6px;color:var(--gr)}
input,select,textarea{width:100%;padding:13px;border:1px solid var(--ln);border-radius:12px;font-size:16px;background:#fff;color:var(--bk);font-family:inherit}
textarea{min-height:110px;resize:vertical;line-height:1.4}
input:focus,select:focus,textarea:focus{outline:2px solid var(--or);border-color:var(--or)}
.hint{font-size:12px;color:var(--gr);margin-top:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.calc{background:var(--or2);border-radius:12px;padding:12px;margin-top:14px;font-weight:700;display:flex;justify-content:space-between}
.btn{width:100%;margin-top:16px;border:0;background:var(--or);color:#111;border-radius:14px;padding:15px;font-size:16px;font-weight:800}
.btn.sec{background:#f3f3f3;color:var(--bk)}
.btn.del{background:#fdecea;color:var(--rd)}
.btn:disabled{opacity:.6}
.back{border:0;background:none;color:var(--bk);font-weight:700;font-size:15px;padding:12px 0 0}
.imgs{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.im{position:relative;width:84px;height:84px;border-radius:12px;overflow:hidden;background:var(--or2)}
.im img{width:100%;height:100%;object-fit:cover;display:block}
.im .x{position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.7);color:#fff;font-size:14px;line-height:1;padding:0}
.im .mk{position:absolute;left:0;bottom:0;right:0;background:var(--or);color:#111;font-size:10px;font-weight:700;text-align:center;padding:2px 0}
.im .fst{position:absolute;bottom:3px;left:3px;border:0;border-radius:6px;background:rgba(0,0,0,.7);color:#fff;font-size:10px;padding:3px 6px}
.addim{width:84px;height:84px;border-radius:12px;border:2px dashed var(--or);color:var(--bk);display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:700;cursor:pointer}
.sw{display:flex;align-items:center;gap:10px;margin-top:16px;font-weight:600}
.sw input{width:22px;height:22px}
.msg{text-align:center;color:var(--gr);padding:60px 20px}
.ord{border:1px solid var(--ln);border-radius:14px;padding:12px;margin:12px 0}
.ord .top{display:flex;justify-content:space-between;font-weight:800}
.st{font-size:12px;font-weight:700;padding:3px 8px;border-radius:8px}
.st.wait_receipt{background:#eee;color:#555}.st.checking{background:#fff3cd;color:#8a6d00}
.st.paid{background:#d9f2e3;color:var(--gn)}.st.rejected{background:#fdecea;color:var(--rd)}
.ord p{margin:6px 0 0;font-size:14px;line-height:1.4}
.st.ship{background:var(--or2);color:#111}
.stg{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.stg button{border:1px solid var(--ln);background:#fff;border-radius:10px;padding:10px;font-size:14px;font-weight:600;text-align:left;color:var(--bk)}
.stg button.on{background:var(--or);border-color:var(--or);color:#111}
.stg button.pay{background:#eef9f1;border-color:#bfe5cc}
.stg button.no{background:#fdecea;border-color:#f3c3be}
.stl{font-size:12px;font-weight:700;color:var(--gr);margin-top:12px}
#crop{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;padding:14px}
#crop .cb{background:#fff;border-radius:18px;padding:14px;width:100%;max-width:380px}
#crop h3{margin:0 0 10px;font-size:16px}
#crop canvas{width:100%;aspect-ratio:1/1;border-radius:12px;background:#fff;border:1px solid var(--ln);touch-action:none;display:block}
#crop input[type=range]{width:100%;padding:0;margin:14px 0 4px;border:0;accent-color:#FED700}
#crop .hint{margin:4px 0 0}
#crop .two{margin-top:10px}
#crop .btn{margin-top:0}
</style>
</head>
<body>
<header>ELECZONA <span>admin</span></header>
<div id="app"><div class="msg">Yuklanmoqda...</div></div>

<script>
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }

const CATS = {kiyim:"Kiyim", elektr:"Elektronika", uy:"Uy-ro'zg'or"};
const STATUS = {wait_receipt:"Chek kutilmoqda", checking:"Tekshirilmoqda", paid:"To'langan", rejected:"Rad etilgan"};
const MAXIMG = 6;
let tab = "products", list = [], ords = [], stages = [], f = null, saving = false, denied = "", opening = false;

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = n => Number(n||0).toLocaleString("ru-RU") + " so'm";

async function api(path, method="GET", body){
  const r = await fetch(path, {
    method,
    headers:{"Content-Type":"application/json","X-Init-Data":(tg && tg.initData) || ""},
    body: body ? JSON.stringify(body) : undefined
  });
  if(!r.ok){
    let d = ""; try{ d = (await r.json()).detail }catch(e){}
    const err = new Error(typeof d === "string" && d ? d : r.status); err.status = r.status; throw err;
  }
  return r.json();
}

async function loadAll(){
  try{
    [list, ords] = await Promise.all([api("/api/admin/products"), api("/api/admin/orders")]);
    try{ stages = (await (await fetch("/api/config")).json()).stages || []; }catch(e){}
  }catch(e){
    denied = e.status === 403 ? "Sizda ruxsat yo'q." : (e.status === 401 ? "Admin panelni botdagi /admin buyrug'i orqali, Telegram ichida oching." : "Xatolik: " + e.message);
  }
  render();
}

function alertMsg(s){ (tg && tg.showAlert) ? tg.showAlert(s) : alert(s); }
let stats = null;
async function openStats(){
  tab = "stats"; render();
  try{ stats = await api("/api/admin/stats"); }catch(e){ alertMsg("Xatolik: " + e.message); }
  render();
}
function setTab(t){ tab = t; render(); }

function stageName(o){
  if(o.ship){ const s = stages.find(x=>x.k===o.ship); return esc(s ? s.uz : o.ship); }
  return STATUS[o.status]||o.status;
}
function ask(msg, fn){
  if(tg && tg.showConfirm) tg.showConfirm(msg, ok=>{ if(ok) fn(); });
  else if(confirm(msg)) fn();
}
async function afterOrderChange(r){
  ords = await api("/api/admin/orders"); render();
  if(r && r.sent === false) alertMsg("Holat saqlandi, lekin mijozga xabar bormadi (mijoz botni /start qilmagan bo'lishi mumkin).");
}
function setShip(id, k){
  const s = stages.find(x=>x.k===k);
  ask("#"+id+" buyurtma egasiga yuborilsinmi?\n\n"+(s?s.uz:k), async ()=>{
    try{ await afterOrderChange(await api("/api/admin/orders/"+id+"/ship","POST",{stage:k})); }
    catch(e){ alertMsg("Xatolik: "+e.message); }
  });
}
function setPay(id, ok){
  ask(ok ? "To'lov tasdiqlansinmi?" : "To'lov rad etilsinmi?", async ()=>{
    try{ await afterOrderChange(await api("/api/admin/orders/"+id+"/pay","POST",{ok})); }
    catch(e){ alertMsg("Xatolik: "+e.message); }
  });
}

function listView(){
  const tabs = `<div class="tabs"><button class="${tab==='products'?'on':''}" onclick="setTab('products')">Mahsulotlar (${list.length})</button>
  <button class="${tab==='orders'?'on':''}" onclick="setTab('orders')">Buyurtmalar (${ords.length})</button>
  <button class="${tab==='stats'?'on':''}" onclick="openStats()">Hisobot</button></div>`;
  if(tab === "stats"){
    if(!stats) return tabs + '<div class="wrap"><div class="msg">Yuklanmoqda...</div></div>';
    const cards = stats.periods.map(p=>`<div class="ord"><div class="top"><span>${p.label}</span><span>${p.orders} ta buyurtma</span></div>
      <p>Savdo: <b>${money(p.revenue)}</b></p><p>Sof foyda: <span class="${p.profit>=0?'profit':'loss'}">${money(p.profit)}</span></p></div>`).join("");
    return tabs + `<div class="wrap">${cards}<p class="hint">Faqat to'lovi tasdiqlangan buyurtmalar hisoblanadi. Foyda = sotuv narxi − Pinduoduo narxi. Hali tasdiqlanmagan: ${stats.pending} ta.</p></div>`;
  }
  if(tab === "orders"){
    const rows = ords.map(o=>`<div class="ord"><div class="top"><span>#${o.id}</span><span class="st ${o.ship?'ship':o.status}">${stageName(o)}</span></div>
      <p>${o.items.map(i=>esc(i.name)+" × "+i.qty).join("<br>")}</p>
      <p><b>${money(o.total)}</b></p>
      <p>👤 ${esc(o.name)} · ${esc(o.phone)}<br>📍 ${esc(o.region)}, ${esc(o.city)}<br>📮 ${esc(o.post)}</p>
      <p style="color:#888;font-size:12px">${new Date(o.created*1000).toLocaleString("ru-RU",{timeZone:"Asia/Tashkent"})}</p>
      <div class="stl">TO'LOV: <span class="st ${o.status}">${STATUS[o.status]||o.status}</span></div>
      <div class="stg"><button class="pay" onclick="setPay(${o.id},true)">✅ To'lovni tasdiqlash</button>
      <button class="no" onclick="setPay(${o.id},false)">❌ To'lovni rad etish</button></div>
      <div class="stl">YETKAZISH HOLATI (bossangiz mijozga xabar boradi):</div>
      <div class="stg">${stages.map(s=>`<button class="${o.ship===s.k?'on':''}" onclick="setShip(${o.id},'${s.k}')">${esc(s.uz)}</button>`).join("")}</div></div>`).join("");
    return tabs + `<div class="wrap">${rows || '<div class="msg">Hali buyurtma yo\'q</div>'}</div>`;
  }
  const rows = list.map(p=>`<div class="item" onclick="edit(${p.id})">
    <div class="thumb">${p.img?`<img src="${p.img}" alt="">`:"📦"}</div>
    <div class="mid"><div class="nm">${esc(p.name_uz)}${p.active?"":'<span class="tag">yashirin</span>'}${p.sold_out?'<span class="tag">tugadi</span>':""}</div>
    <div class="sub">${CATS[p.cat]} · sotuv ${money(p.price)}</div>
    <div class="sub">foyda: <span class="${p.profit>=0?'profit':'loss'}">${money(p.profit)}</span></div></div></div>`).join("");
  return tabs + `<div class="wrap">${rows || '<div class="msg">Hali mahsulot yo\'q. Pastdagi tugma bilan qo\'shing.</div>'}</div>
    <button class="fab" onclick="edit(0)">+ Mahsulot qo'shish</button>`;
}

const blank = () => ({id:0, name_uz:"", name_ru:"", cat:"kiyim", cost:"", price:"", old_price:"", active:true,
                      desc_uz:"", desc_ru:"", sizes:"", colors:"", sold_out:false, images:[]});

async function edit(id){
  if(opening) return;
  if(!id){ f = blank(); window.scrollTo(0,0); render(); return; }
  opening = true;
  try{
    const p = await api("/api/admin/products/" + id);
    f = {id:p.id, name_uz:p.name_uz, name_ru:p.name_ru, cat:p.cat, cost:p.cost, price:p.price, old_price:p.old_price||"",
         active:p.active, sold_out:!!p.sold_out, desc_uz:p.desc_uz, desc_ru:p.desc_ru, sizes:p.sizes, colors:p.colors,
         images:p.images.map(i => ({id:i.id, url:i.url}))};
    window.scrollTo(0,0); render();
  }catch(e){ alertMsg("Ochib bo'lmadi: " + e.message); }
  opening = false;
}

function imgsHtml(){
  const ims = f.images.map((im,i)=>`<div class="im"><img src="${im.url || im.data}" alt="">
    <button class="x" onclick="rmImg(${i})">✕</button>
    ${i===0 ? '<span class="mk">ASOSIY</span>' : `<button class="fst" onclick="firstImg(${i})">asosiy qil</button>`}</div>`).join("");
  const add = f.images.length < MAXIMG
    ? `<label class="addim">+<input type="file" accept="image/*" multiple style="display:none" onchange="pickImgs(this)"></label>` : "";
  return ims + add;
}

function formView(){
  const co = Object.entries(CATS).map(([k,v])=>`<option value="${k}" ${f.cat===k?"selected":""}>${v}</option>`).join("");
  return `<div class="wrap"><button class="back" onclick="f=null;render()">← Orqaga</button>
  <h2 style="margin:10px 0 0">${f.id?"Tahrirlash":"Yangi mahsulot"}</h2>
  <label>Rasmlar (${MAXIMG} tagacha, birinchisi asosiy)</label>
  <div class="imgs" id="imgs">${imgsHtml()}</div>
  <label>Nomi (o'zbekcha)</label><input value="${esc(f.name_uz)}" oninput="f.name_uz=this.value">
  <label>Nomi (ruscha, bo'sh qolsa o'zbekcha ishlatiladi)</label><input value="${esc(f.name_ru)}" oninput="f.name_ru=this.value">
  <label>Kategoriya</label><select onchange="f.cat=this.value">${co}</select>
  <div class="two"><div><label>Pinduoduo narxi (so'm)</label><input type="number" inputmode="numeric" value="${f.cost}" oninput="f.cost=this.value;calc()"></div>
  <div><label>Sotuv narxi (so'm)</label><input type="number" inputmode="numeric" value="${f.price}" oninput="f.price=this.value;calc()"></div></div>
  <div class="calc"><span>Foyda</span><span id="pf"></span></div>
  <label>Eski narx (chegirma uchun, ixtiyoriy)</label><input type="number" inputmode="numeric" value="${f.old_price}" oninput="f.old_price=this.value">
  <label>Tavsif (o'zbekcha)</label><textarea placeholder="Material, o'lchamlar, afzalliklar..." oninput="f.desc_uz=this.value">${esc(f.desc_uz)}</textarea>
  <label>Tavsif (ruscha, bo'sh qolsa o'zbekcha ko'rinadi)</label><textarea oninput="f.desc_ru=this.value">${esc(f.desc_ru)}</textarea>
  <label>O'lchamlar (ixtiyoriy)</label><input placeholder="S, M, L, XL" value="${esc(f.sizes)}" oninput="f.sizes=this.value">
  <div class="hint">Vergul bilan ajrating. Bo'sh qoldirsangiz, mijoz o'lcham tanlamaydi.</div>
  <label>Ranglar (ixtiyoriy)</label><input placeholder="Qora, Oq, Qizil" value="${esc(f.colors)}" oninput="f.colors=this.value">
  <div class="hint">Ranglarni ham vergul bilan yozing. Bo'sh qoldirsangiz, tanlanmaydi.</div>
  <div class="sw"><input type="checkbox" ${f.active?"checked":""} onchange="f.active=this.checked"> Do'konda ko'rsatish</div>
  <div class="sw"><input type="checkbox" ${f.sold_out?"checked":""} onchange="f.sold_out=this.checked"> Tugadi (buyurtma qilib bo'lmaydi)</div>
  <button class="btn" id="sv" onclick="save()">Saqlash</button>
  ${f.id?`<button class="btn del" onclick="del()">O'chirish</button>`:""}</div>`;
}

function calc(){
  const el = document.getElementById("pf"); if(!el) return;
  const v = (+f.price||0) - (+f.cost||0);
  el.textContent = money(v); el.className = v>=0 ? "profit" : "loss";
}

function compress(file){
  return new Promise((res, rej)=>{
    const rd = new FileReader();
    rd.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        const M = 900, k = Math.min(1, M/Math.max(img.width, img.height));
        const w = Math.round(img.width*k), h = Math.round(img.height*k);
        const c = document.createElement("canvas"); c.width = w; c.height = h;
        c.getContext("2d").drawImage(img, 0, 0, w, h);
        res(c.toDataURL("image/jpeg", 0.78));
      };
      img.onerror = rej; img.src = rd.result;
    };
    rd.onerror = rej; rd.readAsDataURL(file);
  });
}

async function pickImgs(inp){
  const files = Array.from(inp.files || []);
  inp.value = "";
  for(const file of files){
    if(f.images.length >= MAXIMG) break;
    try{
      const data = await cropFile(file);
      if(data) f.images.push({data});
    }catch(e){ alertMsg("Rasmni o'qib bo'lmadi"); }
  }
  const box = document.getElementById("imgs"); if(box) box.innerHTML = imgsHtml();
}

/* ---------- rasmni kesish va o'lchamini sozlash (kvadrat) ---------- */
const CS = 320, OUT = 900;           // oyna o'lchami / yakuniy rasm o'lchami
function cropFile(file){
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("img")); };
    img.onload = () => {
      const iw = img.naturalWidth, ih = img.naturalHeight;
      const fit = Math.min(CS/iw, CS/ih), cover = Math.max(CS/iw, CS/ih), maxS = cover * 3;
      let s = cover, ox = (CS - iw*s)/2, oy = (CS - ih*s)/2;
      const wrap = document.createElement("div"); wrap.id = "crop";
      wrap.innerHTML = `<div class="cb"><h3>Rasmni sozlang</h3>
        <canvas id="cc" width="${CS*2}" height="${CS*2}"></canvas>
        <input id="cz" type="range" min="0" max="1000" value="${Math.round((s-fit)/(maxS-fit)*1000)}">
        <div class="hint">Barmoq bilan suring, pastdagi chiziq bilan kattalashtiring.</div>
        <div class="two" style="margin-top:12px">
          <button class="btn sec" id="cfit">Butun rasm</button>
          <button class="btn sec" id="ccov">To'ldirish</button></div>
        <div class="two" style="margin-top:10px">
          <button class="btn sec" id="cno">Bekor qilish</button>
          <button class="btn" id="cok">Tayyor</button></div></div>`;
      document.body.appendChild(wrap);
      const cv = wrap.querySelector("#cc"), z = wrap.querySelector("#cz");
      const clamp = () => {
        const w = iw*s, hh = ih*s;
        ox = w <= CS ? (CS - w)/2 : Math.min(0, Math.max(CS - w, ox));
        oy = hh <= CS ? (CS - hh)/2 : Math.min(0, Math.max(CS - hh, oy));
      };
      const draw = (c, k) => {
        c.fillStyle = "#fff"; c.fillRect(0, 0, CS*k, CS*k);
        c.drawImage(img, ox*k, oy*k, iw*s*k, ih*s*k);
      };
      const redraw = () => { clamp(); draw(cv.getContext("2d"), 2); };
      const setScale = ns => {
        ns = Math.min(maxS, Math.max(fit, ns));
        const cx = (CS/2 - ox)/s, cy = (CS/2 - oy)/s;      // markaz nuqtasi rasmda
        s = ns; ox = CS/2 - cx*s; oy = CS/2 - cy*s;
        z.value = Math.round((s - fit)/(maxS - fit)*1000);
        redraw();
      };
      z.oninput = () => setScale(fit + (maxS - fit) * z.value / 1000);
      wrap.querySelector("#cfit").onclick = () => setScale(fit);
      wrap.querySelector("#ccov").onclick = () => { setScale(cover); };
      // surish va ikki barmoq bilan kattalashtirish
      const pts = new Map(); let lastD = 0;
      cv.onpointerdown = e => { cv.setPointerCapture(e.pointerId); pts.set(e.pointerId, [e.clientX, e.clientY]); lastD = 0; };
      cv.onpointerup = cv.onpointercancel = e => { pts.delete(e.pointerId); lastD = 0; };
      cv.onpointermove = e => {
        if(!pts.has(e.pointerId)) return;
        const prev = pts.get(e.pointerId); const k = CS / cv.getBoundingClientRect().width;
        pts.set(e.pointerId, [e.clientX, e.clientY]);
        if(pts.size === 1){ ox += (e.clientX - prev[0]) * k; oy += (e.clientY - prev[1]) * k; redraw(); }
        else if(pts.size === 2){
          const [a, b] = Array.from(pts.values()); const d = Math.hypot(a[0]-b[0], a[1]-b[1]);
          if(lastD) setScale(s * d / lastD); lastD = d;
        }
      };
      const close = () => { wrap.remove(); URL.revokeObjectURL(url); };
      wrap.querySelector("#cno").onclick = () => { close(); resolve(null); };
      wrap.querySelector("#cok").onclick = () => {
        const out = document.createElement("canvas"); out.width = OUT; out.height = OUT;
        draw(out.getContext("2d"), OUT / CS);
        const data = out.toDataURL("image/jpeg", 0.8);
        close(); resolve(data);
      };
      redraw();
    };
    img.src = url;
  });
}
function rmImg(i){ f.images.splice(i,1); document.getElementById("imgs").innerHTML = imgsHtml(); }
function firstImg(i){ const [x] = f.images.splice(i,1); f.images.unshift(x); document.getElementById("imgs").innerHTML = imgsHtml(); }

async function save(){
  if(saving) return;
  if(!f.name_uz.trim()){ alertMsg("Nomini kiriting"); return; }
  if(!(+f.price > 0)){ alertMsg("Sotuv narxini kiriting"); return; }
  saving = true; const b = document.getElementById("sv"); if(b){ b.disabled = true; b.textContent = "Saqlanmoqda..."; }
  const body = {name_uz:f.name_uz.trim(), name_ru:f.name_ru.trim(), cat:f.cat, cost:+f.cost||0, price:+f.price,
                old_price:+f.old_price||null, active:f.active, sold_out:f.sold_out,
                desc_uz:f.desc_uz, desc_ru:f.desc_ru, sizes:f.sizes, colors:f.colors,
                images:f.images.map(im => im.id ? {id:im.id} : {data:im.data})};
  try{
    if(f.id) await api("/api/admin/products/"+f.id, "PUT", body);
    else await api("/api/admin/products", "POST", body);
    f = null; list = await api("/api/admin/products");
  }catch(e){ alertMsg("Xatolik: " + e.message); }
  saving = false; render();
}

async function del(){
  const go = async ()=>{
    try{ await api("/api/admin/products/"+f.id, "DELETE"); f = null; list = await api("/api/admin/products"); render(); }
    catch(e){ alertMsg("Xatolik: " + e.message); }
  };
  if(tg && tg.showConfirm) tg.showConfirm("Mahsulot o'chirilsinmi?", ok=>{ if(ok) go(); });
  else if(confirm("Mahsulot o'chirilsinmi?")) go();
}

function render(){
  const app = document.getElementById("app");
  if(denied){ app.innerHTML = `<div class="msg">${esc(denied)}</div>`; return; }
  app.innerHTML = f ? formView() : listView();
  if(f) calc();
}
loadAll();
</script>
</body>
