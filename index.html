<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Xitoy Market</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--or:#FF7A00;--or2:#FFF1E3;--bk:#141414;--gr:#6b6b6b;--ln:#ececec;--bg:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--bk);padding-bottom:84px}
header{position:sticky;top:0;z-index:10;background:var(--bk);color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between}
header h1{margin:0;font-size:18px;letter-spacing:.3px}
header h1 span{color:var(--or)}
.lang{display:flex;gap:6px}
.lang button{border:1px solid #444;background:transparent;color:#fff;border-radius:8px;padding:5px 10px;font-weight:600}
.lang button.on{background:var(--or);border-color:var(--or);color:#fff}
.cats{display:flex;gap:8px;overflow-x:auto;padding:12px 16px;scrollbar-width:none;position:sticky;top:50px;background:#fff;z-index:9;border-bottom:1px solid var(--ln)}
.cats::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--ln);background:#fff;border-radius:20px;padding:8px 16px;font-size:14px;font-weight:600;color:var(--bk)}
.chip.on{background:var(--or);border-color:var(--or);color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px}
.card{border:1px solid var(--ln);border-radius:14px;overflow:hidden;background:#fff;display:flex;flex-direction:column}
.pic{height:140px;background:var(--or2);display:flex;align-items:center;justify-content:center;font-size:56px;position:relative}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.badge{position:absolute;top:8px;left:8px;background:var(--bk);color:#fff;font-size:11px;font-weight:700;padding:3px 7px;border-radius:6px}
.info{padding:10px;display:flex;flex-direction:column;gap:4px;flex:1}
.name{font-size:14px;font-weight:600;line-height:1.25}
.price{font-size:15px;font-weight:800;color:var(--or)}
.old{font-size:12px;color:var(--gr);text-decoration:line-through;margin-left:6px;font-weight:400}
.add{margin-top:auto;border:0;background:var(--bk);color:#fff;border-radius:10px;padding:9px;font-weight:700;font-size:14px}
.add:active{background:var(--or)}
.bar{position:fixed;left:12px;right:12px;bottom:12px;background:var(--or);color:#fff;border:0;border-radius:14px;padding:15px 18px;display:flex;justify-content:space-between;font-size:16px;font-weight:800;box-shadow:0 6px 18px rgba(255,122,0,.35)}
.bar:disabled{opacity:.6}
.page{padding:16px}
.page h2{margin:0 0 14px;font-size:20px}
.back{border:0;background:none;color:var(--or);font-weight:700;font-size:15px;padding:0 0 12px}
.row{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--ln)}
.row .em{font-size:30px;width:52px;height:52px;background:var(--or2);border-radius:12px;display:flex;align-items:center;justify-content:center;overflow:hidden;flex:none}
.row .em img{width:100%;height:100%;object-fit:cover}
.row .mid{flex:1;min-width:0}
.var{font-size:12px;color:var(--gr);margin-top:2px}
.qty{display:flex;align-items:center;gap:10px}
.qty button{width:30px;height:30px;border-radius:50%;border:1px solid var(--ln);background:#fff;font-size:18px;font-weight:700}
.total{display:flex;justify-content:space-between;font-size:18px;font-weight:800;padding:16px 0}
label{display:block;font-size:13px;font-weight:600;margin:12px 0 6px;color:var(--gr)}
input,select{width:100%;padding:13px;border:1px solid var(--ln);border-radius:12px;font-size:16px;background:#fff;color:var(--bk)}
input:focus,select:focus{outline:2px solid var(--or);border-color:var(--or)}
.btn{width:100%;margin-top:18px;border:0;background:var(--or);color:#fff;border-radius:14px;padding:15px;font-size:16px;font-weight:800}
.btn:disabled{opacity:.6}
.box{background:var(--or2);border:1px dashed var(--or);border-radius:14px;padding:14px;margin:12px 0}
.cardno{font-size:22px;font-weight:800;letter-spacing:1px;margin:6px 0}
.empty{text-align:center;color:var(--gr);padding:60px 20px}
.done{text-align:center;padding:50px 20px}
.done .big{font-size:64px}
/* mahsulot sahifasi */
.pback{position:absolute;top:10px;left:10px;z-index:3;width:38px;height:38px;border-radius:50%;border:0;background:rgba(20,20,20,.65);color:#fff;font-size:20px;font-weight:700}
.gwrap{position:relative;background:var(--or2)}
.gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.gal::-webkit-scrollbar{display:none}
.gal img{flex:none;width:100%;aspect-ratio:1/1;object-fit:cover;scroll-snap-align:center;display:block}
.nogal{height:300px;display:flex;align-items:center;justify-content:center;font-size:80px}
.dots{position:absolute;bottom:10px;left:0;right:0;display:flex;justify-content:center;gap:6px}
.dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.6);display:block}
.dots i.on{background:var(--or)}
.pbody{padding:16px}
.pbody .ptitle{font-size:20px;font-weight:800;line-height:1.25;margin:0 0 8px}
.pbody .pprice{font-size:24px;font-weight:900;color:var(--or)}
.pbody .pprice .old{font-size:15px}
.vlabel{font-size:13px;font-weight:700;color:var(--gr);margin:18px 0 8px}
.vchips{display:flex;flex-wrap:wrap;gap:8px}
.vchip{border:1px solid var(--ln);background:#fff;color:var(--bk);border-radius:10px;padding:9px 16px;font-size:15px;font-weight:700}
.vchip.on{background:var(--bk);border-color:var(--bk);color:#fff}
.pdesc{margin-top:18px;font-size:15px;line-height:1.5;white-space:pre-line;color:#333}
.pdesc h4{margin:0 0 6px;font-size:13px;color:var(--gr);text-transform:uppercase;letter-spacing:.5px}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* Do'kon nomi (ikki so'z): shu yerdan o'zgartiring */
const SHOP = ["Xitoy", "Market"];

const T = {
  uz:{all:"Hammasi",kiyim:"Kiyim",elektr:"Elektronika",uy:"Uy-ro'zg'or",sale:"Chegirmalar",add:"Savatga",choose:"Tanlash",cart:"Savat",
      empty:"Savat bo'sh",total:"Jami",order:"Buyurtma berish",back:"← Orqaga",sum:"so'm",
      delivery:"Yetkazib berish",name:"Ismingiz",phone:"Telefon raqam",region:"Viloyat",city:"Shahar / tuman",
      post:"Eng yaqin Uzpost punkti",next:"To'lovga o'tish",pay:"To'lov",
      payInfo:"Quyidagi kartaga to'lovni o'tkazing, so'ng pastdagi tugmani bosing. Bot sizdan chek rasmini so'raydi.",
      confirm:"To'lov qildim, buyurtmani yuborish",fill:"Barcha maydonlarni to'ldiring",sel:"Tanlang",
      loading:"Yuklanmoqda...",noprod:"Hozircha mahsulot yo'q",fail:"Yuklab bo'lmadi. Telegram ichida qayta oching.",
      error:"Xatolik yuz berdi. Qayta urinib ko'ring.",doneT:"Buyurtma qabul qilindi!",
      doneX:"Botga o'ting va to'lov chekining rasmini yuboring. Tasdiqlangach xabar beramiz.",close:"Botga qaytish",
      size:"O'lcham",color:"Rang",about:"Mahsulot haqida",pickSize:"O'lchamni tanlang",pickColor:"Rangni tanlang",toCart:"Savatga qo'shish"},
  ru:{all:"Все",kiyim:"Одежда",elektr:"Электроника",uy:"Для дома",sale:"Скидки",add:"В корзину",choose:"Выбрать",cart:"Корзина",
      empty:"Корзина пуста",total:"Итого",order:"Оформить заказ",back:"← Назад",sum:"сум",
      delivery:"Доставка",name:"Ваше имя",phone:"Номер телефона",region:"Область",city:"Город / район",
      post:"Ближайшее отделение Uzpost",next:"Перейти к оплате",pay:"Оплата",
      payInfo:"Переведите оплату на карту ниже, затем нажмите кнопку. Бот попросит прислать фото чека.",
      confirm:"Я оплатил, отправить заказ",fill:"Заполните все поля",sel:"Выберите",
      loading:"Загрузка...",noprod:"Пока нет товаров",fail:"Не удалось загрузить. Откройте заново в Telegram.",
      error:"Произошла ошибка. Попробуйте ещё раз.",doneT:"Заказ принят!",
      doneX:"Перейдите в бота и отправьте фото чека об оплате. После подтверждения мы сообщим.",close:"Вернуться в бота",
      size:"Размер",color:"Цвет",about:"О товаре",pickSize:"Выберите размер",pickColor:"Выберите цвет",toCart:"Добавить в корзину"}
};
const REGIONS = {
  uz:["Toshkent shahri","Toshkent viloyati","Andijon","Buxoro","Farg'ona","Jizzax","Namangan","Navoiy","Qashqadaryo","Qoraqalpog'iston","Samarqand","Sirdaryo","Surxondaryo","Xorazm"],
  ru:["г. Ташкент","Ташкентская обл.","Андижан","Бухара","Фергана","Джизак","Наманган","Навои","Кашкадарья","Каракалпакстан","Самарканд","Сырдарья","Сурхандарья","Хорезм"]
};

const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }

let lang = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.language_code === "ru") ? "ru" : "uz";
let view = "shop", cat = "all";
let products = [], loaded = false, failed = false, cfg = {card:"", owner:""}, busy = false;
let cart = [];                       // [{id,size,color,qty}]
let curId = null, sel = {size:"", color:""}, detail = {};
let form = {name:"", phone:"+998", region:"", city:"", post:""};

const t = k => T[lang][k];
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => Number(n).toLocaleString("ru-RU") + " " + t("sum");
const P = id => products.find(p => p.id == id);
const pname = p => lang === "ru" ? p.name_ru : p.name_uz;
const count = () => cart.filter(l => P(l.id)).reduce((a,l) => a + l.qty, 0);
const total = () => cart.reduce((s,l) => s + (P(l.id) ? P(l.id).price * l.qty : 0), 0);
const sameLine = (l,id,size,color) => l.id == id && l.size === size && l.color === color;

async function load(){
  try{
    const [a,b] = await Promise.all([fetch("/api/products"), fetch("/api/config")]);
    if(!a.ok || !b.ok) throw 0;
    products = await a.json(); cfg = await b.json(); loaded = true;
  }catch(e){ failed = true; }
  render();
}

function setLang(l){ lang = l; render(); }
function setCat(c){ cat = c; render(); }
function go(v){ view = v; window.scrollTo(0,0); render(); }
function addLine(id,size="",color=""){
  const l = cart.find(x => sameLine(x,id,size,color));
  if(l) l.qty++; else cart.push({id,size,color,qty:1});
}
function quickAdd(id){ addLine(id); render(); }
function chg(i,d){ cart[i].qty += d; if(cart[i].qty <= 0) cart.splice(i,1); if(!count()) view = "shop"; render(); }
function setF(k,v){ form[k] = v; }

/* ---------- mahsulot sahifasi ---------- */
async function openP(id){
  curId = id; sel = {size:"", color:""}; view = "product";
  window.scrollTo(0,0); render();
  if(!detail[id]){
    try{ const r = await fetch("/api/products/" + id); if(r.ok) detail[id] = await r.json(); }catch(e){}
    if(view === "product" && curId === id) render();
  }
}
function galScroll(el){
  const i = Math.round(el.scrollLeft / el.clientWidth);
  document.querySelectorAll("#dots i").forEach((d,k) => d.classList.toggle("on", k === i));
}
function selV(k,i){
  const d = detail[curId]; const arr = k === "size" ? d.sizes : d.colors;
  sel[k] = arr[i];
  document.querySelectorAll('.vchip[data-k="' + k + '"]').forEach(b => b.classList.toggle("on", +b.dataset.i === i));
}
function addFromPage(){
  const d = detail[curId]; if(!d) return;
  if(d.sizes.length && !sel.size){ alertMsg(t("pickSize")); return; }
  if(d.colors.length && !sel.color){ alertMsg(t("pickColor")); return; }
  addLine(curId, d.sizes.length ? sel.size : "", d.colors.length ? sel.color : "");
  view = "shop"; window.scrollTo(0,0); render();
}

function productView(){
  const p = P(curId);
  if(!p){ view = "shop"; return shop(); }
  const d = detail[curId];
  const imgs = d ? d.images : (p.img ? [p.img] : []);
  const gal = imgs.length
    ? `<div class="gwrap"><button class="pback" onclick="go('shop')">←</button>
       <div class="gal" onscroll="galScroll(this)">${imgs.map(u => `<img src="${u}" alt="">`).join("")}</div>
       ${imgs.length > 1 ? `<div class="dots" id="dots">${imgs.map((_,i) => `<i class="${i===0?'on':''}"></i>`).join("")}</div>` : ""}</div>`
    : `<div class="gwrap"><button class="pback" onclick="go('shop')">←</button><div class="nogal">📦</div></div>`;
  const sale = p.old_price && p.old_price > p.price;
  let vars = "";
  if(d){
    if(d.sizes.length) vars += `<div class="vlabel">${t("size")}</div><div class="vchips">${d.sizes.map((s,i) => `<button class="vchip ${sel.size===s?'on':''}" data-k="size" data-i="${i}" onclick="selV('size',${i})">${esc(s)}</button>`).join("")}</div>`;
    if(d.colors.length) vars += `<div class="vlabel">${t("color")}</div><div class="vchips">${d.colors.map((s,i) => `<button class="vchip ${sel.color===s?'on':''}" data-k="color" data-i="${i}" onclick="selV('color',${i})">${esc(s)}</button>`).join("")}</div>`;
  }
  const desc = d ? (lang === "ru" ? d.desc_ru : d.desc_uz) : "";
  const body = `<div class="pbody"><h1 class="ptitle">${esc(pname(p))}</h1>
    <div class="pprice">${fmt(p.price)}${sale ? `<span class="old">${fmt(p.old_price)}</span>` : ""}</div>
    ${d ? vars : `<div class="empty" style="padding:30px 0">${t("loading")}</div>`}
    ${desc ? `<div class="pdesc"><h4>${t("about")}</h4>${esc(desc)}</div>` : ""}</div>`;
  const bar = `<button class="bar" ${d ? "" : "disabled"} onclick="addFromPage()"><span>${t("toCart")}</span><span>${fmt(p.price)}</span></button>`;
  return gal + body + bar;
}

function header(){
  return `<header><h1>${esc(SHOP[0])} <span>${esc(SHOP[1])}</span></h1>
  <div class="lang"><button class="${lang==='uz'?'on':''}" onclick="setLang('uz')">UZ</button>
  <button class="${lang==='ru'?'on':''}" onclick="setLang('ru')">RU</button></div></header>`;
}

function pic(p){ return p.img ? `<img src="${p.img}" loading="lazy" alt="">` : "📦"; }

function shop(){
  const cats = ["all","kiyim","elektr","uy","sale"];
  const chips = cats.map(c=>`<button class="chip ${cat===c?'on':''}" onclick="setCat('${c}')">${t(c)}</button>`).join("");
  let body;
  if(failed) body = `<div class="empty">${t("fail")}</div>`;
  else if(!loaded) body = `<div class="empty">${t("loading")}</div>`;
  else {
    const list = products.filter(p => cat==="all" ? true : cat==="sale" ? (p.old_price && p.old_price>p.price) : p.cat===cat);
    body = list.length ? `<div class="grid">` + list.map(p=>`
      <div class="card"><div class="pic" onclick="openP(${p.id})">${pic(p)}${p.old_price&&p.old_price>p.price?`<span class="badge">-${Math.round((1-p.price/p.old_price)*100)}%</span>`:""}</div>
      <div class="info"><div class="name" onclick="openP(${p.id})">${esc(pname(p))}</div>
      <div><span class="price">${fmt(p.price)}</span>${p.old_price&&p.old_price>p.price?`<span class="old">${fmt(p.old_price)}</span>`:""}</div>
      <button class="add" onclick="${p.has_var ? `openP(${p.id})` : `quickAdd(${p.id})`}">${p.has_var ? t("choose") : t("add")}</button></div></div>`).join("") + `</div>`
      : `<div class="empty">${t("noprod")}</div>`;
  }
  const bar = count() ? `<button class="bar" onclick="go('cart')"><span>🛒 ${t("cart")} · ${count()}</span><span>${fmt(total())}</span></button>` : "";
  return header()+`<div class="cats">${chips}</div>${body}`+bar;
}

function cartView(){
  const rows = cart.map((l,i)=>{
    const p = P(l.id); if(!p) return "";
    const v = [l.size, l.color].filter(Boolean).join(", ");
    return `<div class="row"><div class="em">${pic(p)}</div>
    <div class="mid"><div class="name">${esc(pname(p))}</div>${v?`<div class="var">${esc(v)}</div>`:""}<div class="price">${fmt(p.price*l.qty)}</div></div>
    <div class="qty"><button onclick="chg(${i},-1)">−</button><b>${l.qty}</b><button onclick="chg(${i},1)">+</button></div></div>`;
  }).join("");
  return header()+`<div class="page"><button class="back" onclick="go('shop')">${t("back")}</button>
  <h2>${t("cart")}</h2>${rows || `<div class="empty">${t("empty")}</div>`}
  <div class="total"><span>${t("total")}</span><span>${fmt(total())}</span></div>
  ${rows?`<button class="btn" onclick="go('checkout')">${t("order")}</button>`:""}</div>`;
}

function checkout(){
  const opts = `<option value="">${t("sel")}</option>` + REGIONS[lang].map((r,i)=>`<option value="${i}" ${String(form.region)===String(i)?'selected':''}>${r}</option>`).join("");
  return header()+`<div class="page"><button class="back" onclick="go('cart')">${t("back")}</button>
  <h2>${t("delivery")}</h2>
  <label>${t("name")}</label><input value="${esc(form.name)}" oninput="setF('name',this.value)">
  <label>${t("phone")}</label><input type="tel" inputmode="tel" value="${esc(form.phone)}" oninput="setF('phone',this.value)">
  <label>${t("region")}</label><select onchange="setF('region',this.value)">${opts}</select>
  <label>${t("city")}</label><input value="${esc(form.city)}" oninput="setF('city',this.value)">
  <label>${t("post")}</label><input value="${esc(form.post)}" oninput="setF('post',this.value)">
  <button class="btn" onclick="toPay()">${t("next")}</button></div>`;
}

function alertMsg(s){ (tg && tg.showAlert) ? tg.showAlert(s) : alert(s); }

function toPay(){
  if(!form.name.trim() || form.phone.trim().length<9 || form.region==="" || !form.city.trim() || !form.post.trim()){
    alertMsg(t("fill")); return;
  }
  go("pay");
}

function pay(){
  return header()+`<div class="page"><button class="back" onclick="go('checkout')">${t("back")}</button>
  <h2>${t("pay")}</h2>
  <div class="total"><span>${t("total")}</span><span>${fmt(total())}</span></div>
  <div class="box"><div>${t("payInfo")}</div><div class="cardno">${esc(cfg.card)}</div><div><b>${esc(cfg.owner)}</b></div></div>
  <button class="btn" ${busy?"disabled":""} onclick="send()">${busy?"...":t("confirm")}</button></div>`;
}

async function send(){
  if(busy) return;
  busy = true; render();
  try{
    const r = await fetch("/api/order", {
      method:"POST",
      headers:{"Content-Type":"application/json","X-Init-Data":(tg && tg.initData) || ""},
      body: JSON.stringify({
        name:form.name.trim(), phone:form.phone.trim(),
        region:REGIONS[lang][form.region], city:form.city.trim(), post:form.post.trim(), lang,
        items:cart.filter(l=>P(l.id)).map(l=>({id:+l.id,qty:l.qty,size:l.size,color:l.color}))
      })
    });
    if(!r.ok) throw new Error(r.status);
    cart = []; view = "done";
  }catch(e){ alertMsg(t("error")); }
  busy = false; render();
}

function done(){
  return header()+`<div class="done"><div class="big">✅</div><h2>${t("doneT")}</h2>
  <p>${t("doneX")}</p><button class="btn" onclick="tg&&tg.close()">${t("close")}</button></div>`;
}

function render(){
  const v = {shop,product:productView,cart:cartView,checkout,pay,done}[view];
  document.getElementById("app").innerHTML = v();
}
render();
load();
</script>
</body>
</html>
